# ============================================================================
# PEP CONFIGURATION FILE (OPTIONAL)
# ============================================================================
# This file provides project-specific paths and metadata.
# It is SECONDARY to config.yml - only used for:
#   1. Path placeholders: {process_dir}, {database_dir}, {raw_data}, etc.
#   2. Project name: Overrides project_info.name in config.yml if present
#   3. Raw data location: Used to resolve {raw_data} placeholders
#
# NOTE: sample_table in PEP config is IGNORED - use config.yml instead
# ============================================================================

pep_version: "2.1.0"

project:
  # Project name (OPTIONAL - overrides project_info.name in config.yml if present)
  name: "20251111_cuttag_test"
  # Raw data root directory (used to resolve {raw_data} placeholders)
  raw_data: "/storage/zhangkaiLab/hanlitian/macrophage/data/CUTTAG"
  # NOTE: sample_table here is IGNORED - use project_info.samples.table in config.yml

paths:
  data_dir: "/storage/zhangkaiLab/resource/Collaborators/Hanjie_Li/CUT-seq"
  process_dir: "/storage/zhangkaiLab/hanlitian/macrophage/process"
  database_dir: "/storage/zhangkaiLab/hanlitian/database/algin_ref/atac_pipeline"
  shared_genome_dir: "/storage/zhangkaiLab/shared/genomes/GRCh38"

sample_modifiers:
  append:
    R1: "{raw_data|data/raw}/{fastq_id}_R1.fastq.gz"
    R2: "{raw_data|data/raw}/{fastq_id}_R2.fastq.gz"
    run_label: "{sample}.{run}"

